{% load static %}
<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Вход мастера · Ясна</title><link rel="stylesheet" href="{% static 'dashboard/styles.css' %}"></head>
<body class="login-page">
<main class="login-card">
<div class="brand"><span class="brand-mark">я</span><span>ясна<span class="brand-caption">мастерская и школа труда</span></span></div>
<h1>Кабинет мастера</h1><p class="subtext">Войдите, чтобы открыть расписание и журнал.</p>
<form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}{{ field }}</label>{{ field.errors }}{% endfor %}<input type="hidden" name="next" value="{{ next }}"><button class="primary" type="submit">Войти</button></form>
</main>
</body>
</html>
