<form class="child-filter" method="get" aria-label="Фильтр по ребёнку">
  <input type="hidden" name="page" value="{{ page }}">
  {% if page == "calendar" %}
  <input type="hidden" name="date" value="{{ selected_day|date:'Y-m-d' }}">
  {% endif %}
  <button type="submit" name="child" value="" aria-pressed="{% if selected_child %}false{% else %}true{% endif %}">Все дети</button>
  {% for child in children %}
  <button type="submit" name="child" value="{{ child.pk }}" aria-pressed="{% if selected_child.pk == child.pk %}true{% else %}false{% endif %}">{{ child.name }}</button>
  {% endfor %}
</form>
